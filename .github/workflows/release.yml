name: Release

# A tag `v<version>` (matching package.json) builds the binaries, stages the addon, packs the npm tarball and attaches both to a GitHub release.
#
# Run by hand (Actions > Release > Run workflow, or `gh workflow run release.yml --ref <branch>`), it is a dry run: it makes everything a
# release would publish and stops there. The tarball and the addon zip are the run's `godot-tsc-release` artifact (`pnpm pack` lists the
# tarball's files), and `pnpm publish --dry-run` takes that tarball as far as publishing it. Only a pushed tag publishes, whatever ref a run by hand names.
# Platforms: macOS arm64 natively and the Web side module for stock Godot 4.7 templates (Emscripten 4.0.11), the ones that have been run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# What the run is, in the list of runs: a release of a tag, or a dry run of the ref it was run on.
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Release dry run ({0})', github.ref_name) }}

jobs:
  build-native:
    name: Build native (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Vendor Bun's crates
        run: node scripts/vendor.mjs

      - name: Build
        run: node scripts/build-native.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: out/bin/libgodot_tsc.dylib
          if-no-files-found: error
          # Handed to the release job in the same run; the release keeps what it publishes.
          retention-days: 1

  build-web:
    name: Build Web side module (stock profile)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      # scripts/vendor-bun.py reads Cargo manifests with tomllib, which Python has from 3.11; the image's is 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust toolchain (rust-toolchain.toml) with the Emscripten target and the standard library's sources
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-emscripten
          rustup component add rust-src

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Vendor Bun's crates
        run: node scripts/vendor.mjs

      - name: Build
        run: node scripts/build-web.mjs --profile=stock

      - uses: actions/upload-artifact@v4
        with:
          name: native-web-stock
          path: out/bin/godot_tsc.web.stock.wasm
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-native, build-web]
    name: "${{ github.event_name == 'push' && 'Pack & GitHub release' || 'Pack (dry run, nothing published)' }}"
    # macOS, for `lipo`: the staged manifest lists the architectures the macOS library has (scripts/stage-addon.mjs).
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: The tag names package.json's version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # The lib bundle the package ships comes from Bun's crates.
      - name: Vendor Bun's crates
        run: pnpm vendor

      - name: Build TypeScript
        run: pnpm build

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out/bin/
          merge-multiple: true

      - name: Stage the addon
        run: |
          mkdir -p release
          node scripts/stage-addon.mjs --require-binaries --web-profile=stock
          (cd addon && zip -r ../release/godot-tsc-addon.zip godot-tsc/)

      - name: Pack
        run: pnpm pack --pack-destination release && ls -lah release

      # The tarball as far as publishing it, published or not. It needs no npm credentials.
      - name: pnpm publish --dry-run
        run: pnpm publish --dry-run --no-git-checks release/godot-tsc-*.tgz

      # What a release publishes, for a dry run to download and try.
      - uses: actions/upload-artifact@v4
        with:
          name: godot-tsc-release
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "${GITHUB_REF_NAME}" --notes "godot-tsc ${GITHUB_REF_NAME}"

      - name: Publish to npm (skipped - pending npm credentials)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "npm publishing is not configured yet; the tarball is attached to the GitHub release."
