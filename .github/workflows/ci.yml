name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  typescript:
    name: Typecheck, Test & Build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:types

      - name: Tests (the compiler's tests skip without the native build)
        run: pnpm test

      - name: Build
        run: pnpm build

  native:
    name: Native build & compiler tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetches Bun at the pinned revision from GitHub into .cache/bun and extracts its crates into vendor/bun.
      - name: Vendor Bun's crates
        run: pnpm vendor

      - name: Build the extension and godot-tsc-cli
        run: pnpm build:native --cli

      - name: Rust tests
        run: pnpm test:rust

      - name: Tests, with the compiler
        run: pnpm test
