name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  typescript:
    name: Typecheck, Test & Build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:types

      - name: Tests (the compiler's tests skip without the native build)
        run: pnpm test

      - name: Build
        run: pnpm build

  tests:
    name: Compiler tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetches Bun at the pinned revision from GitHub into .cache/bun and extracts its crates into vendor/bun.
      - name: Vendor Bun's crates
        run: pnpm vendor

      - name: THIRD_PARTY_NOTICES.md is current
        run: pnpm notices --check

      - name: Build the extension and godot-tsc-cli
        run: pnpm build:native --cli

      - name: Rust tests
        run: pnpm test:rust

      - name: Tests, with the compiler
        run: pnpm test

  # Every platform's library and the Web side module, each loaded where it can be: kept two weeks, for trying a commit without building it.
  binaries:
    name: Binaries
    uses: ./.github/workflows/build.yml

  package:
    name: Package (npm tarball and addon zip)
    needs: binaries
    # macOS, for `lipo`: the staged manifest lists the architectures the macOS library has (scripts/stage-addon.mjs).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The lib bundle the package ships comes from Bun's crates.
      - name: Vendor Bun's crates
        run: pnpm vendor

      - name: Build TypeScript
        run: pnpm build

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: out/bin/
          merge-multiple: true

      - name: Stage, zip and pack
        run: |
          mkdir -p package
          node scripts/stage-addon.mjs --require-all-platforms --web-profile=stock
          (cd addon && zip -r ../package/godot-tsc-addon.zip godot-tsc/)
          pnpm pack --pack-destination package
          ls -lah package

      - uses: actions/upload-artifact@v7
        with:
          name: godot-tsc-package
          path: package/
          if-no-files-found: error
          retention-days: 14
